name: Atlas · recordatorios de aprendizaje
on:
  schedule:
    # UTC -> Guatemala (UTC-6): lunes-viernes 19:30; sábado 09:00; domingo 16:00.
    - cron: '30 1 * * 2-6'
    - cron: '0 15 * * 6'
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: no envía; send: crea checklist o aviso de hoy'
        required: true
        default: preview
        type: choice
        options: [preview, send]
permissions:
  contents: read
  issues: write
concurrency:
  group: atlas-learning-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar comportamiento antes de enviar
        run: python -m unittest discover -s tests -p 'test_learning_reminders.py' -v
      - name: Verificar tracking y calendarios
        run: node --test tests/plan-core.test.cjs
      - name: Preparar checklist o recordatorio
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_MODE: ${{ inputs.mode || 'send' }}
        run: python scripts/learning_reminders.py --mode "$ATLAS_MODE"
