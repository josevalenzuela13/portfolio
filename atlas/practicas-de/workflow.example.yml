# Copia a .github/workflows/practica-de.yml en un repositorio de práctica.
# Cambia working-directory si la carpeta se llama distinto.
# No despliega a Databricks ni usa credenciales cloud.
name: Prácticas de Ingeniería de Datos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas/practicas-de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python pipeline.py
